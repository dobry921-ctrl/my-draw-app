<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Рисуйте чертёж</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
        body {
            background: #f0f2f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: max(10px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom));
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        #canvasWrap {
            width: 100%;
            max-width: 700px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.10);
            overflow: hidden;
            position: relative;
            flex: 0 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 16px;
            cursor: crosshair;
            touch-action: none;
        }
        .shape-hint {
            width: 100%;
            max-width: 700px;
            margin-top: 8px;
            padding: 9px 11px;
            border-radius: 10px;
            background: #fff;
            font-size: 13px;
            color: #555;
            text-align: center;
        }
        .tabs {
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #fff;
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .tabs.visible { display: grid; }
        .tab-btn {
            border: 0;
            background: transparent;
            border-radius: 9px;
            padding: 11px 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        .tab-btn.active { background: #3390ec; color: #fff; }
        .tab-btn:not(.active):hover { background: #e9edf2; }

        #dimensionsPanel {
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            display: none;
        }
        #dimensionsPanel.visible { display: block; }
        .panel-title { font-weight: 700; margin-bottom: 8px; }

        .side-input {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #eee;
        }
        .side-input:last-child { border-bottom: 0; }
        .side-input label { font-weight: 600; font-size: 15px; }
        .side-input input {
            width: 110px;
            padding: 8px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: right;
            background: #fff;
        }
        .side-input input:focus { border-color: #3390ec; outline: none; }
        .side-input .unit { font-size: 14px; color: #666; min-width: 24px; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 700px;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 13px 14px;
            font-size: 16px;
            border: 0;
            border-radius: 10px;
            flex: 1 1 30%;
            cursor: pointer;
            font-weight: 650;
            min-width: 110px;
            transition: opacity .2s;
        }
        .toolbar button:disabled { opacity: .42; cursor: not-allowed; }
        .primary { background: #3390ec; color: #fff; }
        .danger { background: #f55353; color: #fff; }
        .success { background: #34a853; color: #fff; }
        .warning { background: #f5a623; color: #fff; }

        .info {
            width: 100%;
            max-width: 700px;
            margin-top: 8px;
            font-size: 14px;
            color: #333;
            text-align: center;
            min-height: 20px;
            line-height: 1.35;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .error-msg.visible { display: block; }

        @media (max-width: 480px) {
            body { padding-left: 7px; padding-right: 7px; }
            .toolbar { gap: 7px; }
            .toolbar button { min-width: 0; padding: 12px 8px; font-size: 14px; }
            .side-input input { width: 100px; }
        }
    </style>
</head>
<body>

    <!-- Канвас -->
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <div class="shape-hint" id="shapeHint">Поставьте минимум 3 точки. Линии и заливка показывают форму фигуры сразу.</div>

    <!-- Вкладки -->
    <div class="tabs" id="tabs">
        <button class="tab-btn active" id="drawingTabBtn" type="button">📐 Чертёж</button>
        <button class="tab-btn" id="dimensionsTabBtn" type="button">📏 Размеры</button>
    </div>

    <!-- Панель ввода размеров -->
    <div id="dimensionsPanel">
        <div class="panel-title">Введите длины сторон в сантиметрах:</div>
        <div id="sideInputs"></div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Статус -->
    <div class="info" id="status">Нажмите на холст, чтобы поставить точку</div>

    <!-- Кнопки -->
    <div class="toolbar">
        <button id="closeBtn" class="success" disabled>🔒 Замкнуть</button>
        <button id="undoBtn" class="warning" disabled>↩ Отменить</button>
        <button id="sendBtn" class="primary" disabled>✅ Отправить</button>
        <button id="clearBtn" class="danger">🗑 Очистить</button>
    </div>

<script>
(function () {
    'use strict';

    const tg = window.Telegram?.WebApp || null;
    if (tg) {
        try {
            tg.ready();
            tg.expand();
        } catch (_) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const closeBtn = document.getElementById('closeBtn');
    const undoBtn = document.getElementById('undoBtn');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const sideInputs = document.getElementById('sideInputs');
    const errorMsg = document.getElementById('errorMsg');
    const tabs = document.getElementById('tabs');
    const drawingTabBtn = document.getElementById('drawingTabBtn');
    const dimensionsTabBtn = document.getElementById('dimensionsTabBtn');
    const dimensionsPanel = document.getElementById('dimensionsPanel');
    const shapeHint = document.getElementById('shapeHint');

    let points = [];
    let isClosed = false;
    let sideFields = [];
    let builtPoints = [];
    let builtSides = [];
    let resizeObserver = null;
    let activeTab = 'drawing';

    function getLabel(index) {
        let n = index + 1;
        let result = '';
        while (n > 0) {
            n--;
            result = String.fromCharCode(65 + (n % 26)) + result;
            n = Math.floor(n / 26);
        }
        return result;
    }

    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.toggle('visible', Boolean(message));
    }

    function getCanvasSize() {
        const rect = canvas.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
    }

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
        const width = Math.max(1, Math.round(rect.width));
        const height = Math.max(1, Math.round(rect.height));

        const targetWidth = Math.round(width * dpr);
        const targetHeight = Math.round(height * dpr);

        if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
            canvas.width = targetWidth;
            canvas.height = targetHeight;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (builtPoints.length >= 3) drawBuilt();
        else drawSketch();
    }

    // ---- Построение ортогонального многоугольника по длинам сторон и направлениям эскиза ----
    function buildOrthogonalFromSketch(sketchPts, sidesCm) {
        const n = sidesCm.length;
        if (n < 3 || sketchPts.length !== n) {
            throw new Error('Для построения нужно минимум 3 вершины.');
        }

        // 1. Вычисляем направления сторон эскиза (векторы)
        const dirs = [];
        for (let i = 0; i < n; i++) {
            const a = sketchPts[i];
            const b = sketchPts[(i + 1) % n];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len = Math.hypot(dx, dy);
            if (len < 1e-6) {
                throw new Error(`Сторона ${getLabel(i)}–${getLabel((i+1)%n)} слишком короткая.`);
            }
            // Нормализованный вектор
            dirs.push({ x: dx / len, y: dy / len });
        }

        // 2. Округляем направления до ближайшего из четырёх (ортогональных)
        const orthoDirs = dirs.map(d => {
            // Находим угол в градусах
            let angle = Math.atan2(d.y, d.x) * 180 / Math.PI;
            // Приводим к [0, 360)
            if (angle < 0) angle += 360;
            // Округляем до ближайшего кратного 90
            const rounded = Math.round(angle / 90) * 90;
            // Преобразуем обратно в вектор (cos, sin)
            const rad = rounded * Math.PI / 180;
            return { x: Math.round(Math.cos(rad)), y: Math.round(Math.sin(rad)) };
        });

        // 3. Строим вершины, начиная с (0,0)
        const pts = [{ x: 0, y: 0 }];
        for (let i = 0; i < n; i++) {
            const prev = pts[i];
            const dir = orthoDirs[i];
            const len = sidesCm[i];
            const nextX = prev.x + dir.x * len;
            const nextY = prev.y + dir.y * len;
            pts.push({ x: nextX, y: nextY });
        }
        // Проверяем замыкание
        const last = pts[pts.length - 1];
        const first = pts[0];
        const dx = last.x - first.x;
        const dy = last.y - first.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.01) {
            throw new Error('Ортогональный многоугольник не замкнулся – проверьте длины сторон.');
        }
        // Убираем последнюю дублирующую точку
        pts.pop();

        // Переводим в метры и сдвигаем к нулю
        const ptsM = pts.map(p => ({ x: p.x / 100, y: p.y / 100 }));
        const minX = Math.min(...ptsM.map(p => p.x));
        const minY = Math.min(...ptsM.map(p => p.y));
        return ptsM.map(p => ({ x: p.x - minX, y: p.y - minY }));
    }

    function polygonAreaAbs(pts) {
        let area = 0;
        for (let i = 0; i < pts.length; i++) {
            const a = pts[i], b = pts[(i + 1) % pts.length];
            area += a.x * b.y - b.x * a.y;
        }
        return Math.abs(area) / 2;
    }

    function maxSideError(pts, targetCm) {
        let maxError = 0;
        for (let i = 0; i < pts.length; i++) {
            const a = pts[i], b = pts[(i + 1) % pts.length];
            const actual = Math.hypot(b.x - a.x, b.y - a.y);
            maxError = Math.max(maxError, Math.abs(actual - targetCm[i]));
        }
        return maxError;
    }

    // Основная функция построения
    function buildPolygonFromSketchAndLengths(sketchPts, sidesCm) {
        const n = sidesCm.length;
        if (n < 3 || sketchPts.length !== n) {
            throw new Error('Для построения нужно минимум 3 вершины.');
        }

        // Сначала пробуем построить ортогональный многоугольник
        try {
            const result = buildOrthogonalFromSketch(sketchPts, sidesCm);
            // Проверяем, что длины сторон совпадают с заданными
            const error = maxSideError(result, sidesCm);
            if (error < 0.01) {
                return result; // успешно
            }
        } catch (e) {
            // Если не получилось – продолжаем к релаксации
        }

        // Если не удалось построить ортогонально – используем релаксацию
        // Общий случай – релаксация (сохраняем ориентацию эскиза)
        const longest = Math.max(...sidesCm);
        const sumOthers = sidesCm.reduce((sum, s) => sum + s, 0) - longest;
        if (longest >= sumOthers - 1e-9) {
            throw new Error('Такие длины сторон не могут образовать замкнутый многоугольник: самая длинная сторона слишком велика.');
        }

        // Масштабируем эскиз под суммарную длину
        let totalSketch = 0;
        for (let i = 0; i < n; i++) {
            const a = sketchPts[i];
            const b = sketchPts[(i + 1) % n];
            totalSketch += Math.hypot(b.x - a.x, b.y - a.y);
        }
        const targetTotal = sidesCm.reduce((a, b) => a + b, 0);
        const scale = targetTotal / totalSketch;
        let pts = sketchPts.map(p => ({ x: p.x * scale, y: p.y * scale }));
        // Сдвиг к нулю
        const x0 = pts[0].x, y0 = pts[0].y;
        pts = pts.map(p => ({ x: p.x - x0, y: p.y - y0 }));

        const reference = pts.map(p => ({ ...p }));
        const iterations = Math.min(5000, Math.max(1500, n * 400));
        const shapeWeight = 0.0005;

        for (let iter = 0; iter < iterations; iter++) {
            for (let i = 1; i < n; i++) {
                pts[i].x += (reference[i].x - pts[i].x) * shapeWeight;
                pts[i].y += (reference[i].y - pts[i].y) * shapeWeight;
            }

            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                const a = pts[i], b = pts[j];
                let dx = b.x - a.x;
                let dy = b.y - a.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 1e-9) {
                    const angle = (2 * Math.PI * i) / n;
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                    dist = 1;
                }
                const target = sidesCm[i];
                const correction = (dist - target) / dist;
                const cx = dx * correction;
                const cy = dy * correction;

                if (i === 0) {
                    b.x -= cx;
                    b.y -= cy;
                } else if (j === 0) {
                    a.x += cx;
                    a.y += cy;
                } else {
                    a.x += cx * 0.5;
                    a.y += cy * 0.5;
                    b.x -= cx * 0.5;
                    b.y -= cy * 0.5;
                }
            }

            const ax = pts[0].x, ay = pts[0].y;
            for (const p of pts) {
                p.x -= ax;
                p.y -= ay;
            }

            if (maxSideError(pts, sidesCm) < 0.0005) break;
        }

        // Дополнительный цикл без сохранения формы
        for (let iter = 0; iter < 200; iter++) {
            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                const a = pts[i], b = pts[j];
                let dx = b.x - a.x;
                let dy = b.y - a.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 1e-9) {
                    const angle = (2 * Math.PI * i) / n;
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                    dist = 1;
                }
                const target = sidesCm[i];
                const correction = (dist - target) / dist;
                const cx = dx * correction;
                const cy = dy * correction;

                if (i === 0) {
                    b.x -= cx;
                    b.y -= cy;
                } else if (j === 0) {
                    a.x += cx;
                    a.y += cy;
                } else {
                    a.x += cx * 0.5;
                    a.y += cy * 0.5;
                    b.x -= cx * 0.5;
                    b.y -= cy * 0.5;
                }
            }
            const ax = pts[0].x, ay = pts[0].y;
            for (const p of pts) {
                p.x -= ax;
                p.y -= ay;
            }
            if (maxSideError(pts, sidesCm) < 0.0001) break;
        }

        const errorCm = maxSideError(pts, sidesCm);
        if (errorCm > 0.05) {
            throw new Error(`Не удалось точно замкнуть фигуру. Максимальная ошибка стороны: ${errorCm.toFixed(2)} см. Попробуйте нарисовать форму ближе к реальной.`);
        }
        if (polygonAreaAbs(pts) < 0.01) {
            throw new Error('Получилась вырожденная фигура с нулевой площадью.');
        }

        const minX = Math.min(...pts.map(p => p.x));
        const minY = Math.min(...pts.map(p => p.y));
        return pts.map(p => ({
            x: (p.x - minX) / 100,
            y: (p.y - minY) / 100
        }));
    }

    // ---- Отрисовка ----
    function drawLivePolygon() {
        if (points.length < 2) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.strokeStyle = '#3390ec';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        points.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#1a73e8';
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(getLabel(i), p.x, p.y - 10);
        });
    }

    function drawSketch() {
        const { width, height } = getCanvasSize();
        ctx.clearRect(0, 0, width, height);

        if (points.length === 0) {
            statusEl.textContent = 'Нажмите на холст, чтобы поставить точку';
            closeBtn.disabled = true;
            undoBtn.disabled = true;
            sendBtn.disabled = true;
            return;
        }

        drawLivePolygon();

        if (isClosed) {
            if (points.length >= 3) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(points[points.length-1].x, points[points.length-1].y);
                ctx.lineTo(points[0].x, points[0].y);
                ctx.strokeStyle = '#3390ec';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(51,144,236,.10)';
                ctx.fill();
                ctx.restore();
            }

            statusEl.textContent = '✅ Фигура замкнута. Переключайтесь между вкладками.';
            shapeHint.textContent = 'На вкладке «Чертёж» – форма, на «Размеры» – ввод длин.';
            closeBtn.disabled = true;
            if (!sideFields.length) buildSideInputs();
            tabs.classList.add('visible');
            if (activeTab === 'dimensions') {
                dimensionsPanel.classList.add('visible');
            } else {
                dimensionsPanel.classList.remove('visible');
            }
        } else {
            statusEl.textContent = points.length >= 3
                ? `Точек: ${points.length}. Замкните кнопкой.`
                : `Точек: ${points.length}. Добавьте ещё ${3 - points.length} точ${points.length === 1 ? 'ку' : 'ки'}.`;
            shapeHint.textContent = points.length >= 3
                ? 'Нажмите "Замкнуть", чтобы зафиксировать.'
                : 'Поставьте минимум 3 точки.';
            closeBtn.disabled = points.length < 3;
            tabs.classList.remove('visible');
            dimensionsPanel.classList.remove('visible');
            sideFields = [];
            sideInputs.innerHTML = '';
            sendBtn.disabled = true;
        }

        undoBtn.disabled = points.length === 0;
        if (!isClosed) sendBtn.disabled = true;
    }

    function drawBuilt() {
        if (builtPoints.length < 3) return;

        const { width: w, height: h } = getCanvasSize();
        ctx.clearRect(0, 0, w, h);

        const xs = builtPoints.map(p => p.x);
        const ys = builtPoints.map(p => p.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const rangeX = Math.max(maxX - minX, 1e-9);
        const rangeY = Math.max(maxY - minY, 1e-9);

        const margin = 48;
        const scale = Math.min(
            (w - 2 * margin) / rangeX,
            (h - 2 * margin) / rangeY
        );
        const offsetX = (w - rangeX * scale) / 2 - minX * scale;
        const offsetY = (h - rangeY * scale) / 2 - minY * scale;

        const screen = p => ({
            x: p.x * scale + offsetX,
            y: p.y * scale + offsetY
        });

        ctx.beginPath();
        const first = screen(builtPoints[0]);
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < builtPoints.length; i++) {
            const p = screen(builtPoints[i]);
            ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(26,115,232,.12)';
        ctx.fill();
        ctx.strokeStyle = '#1a73e8';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.stroke();

        const n = builtPoints.length;
        for (let i = 0; i < n; i++) {
            const p = screen(builtPoints[i]);
            const p2 = screen(builtPoints[(i + 1) % n]);

            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#1a73e8';
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(getLabel(i), p.x, p.y - 10);

            const mx = (p.x + p2.x) / 2;
            const my = (p.y + p2.y) / 2;
            const dx = p2.x - p.x;
            const dy = p2.y - p.y;
            const len = Math.hypot(dx, dy);

            if (len > 32) {
                const nx = -dy / len * 14;
                const ny = dx / len * 14;
                ctx.fillStyle = '#d32f2f';
                ctx.font = '12px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${builtSides[i].toFixed(1)} см`, mx + nx, my + ny);
            }
        }

        statusEl.textContent = '✅ Фигура построена. Можно отправлять.';
        sendBtn.disabled = false;
    }

    function rebuildFigure() {
        showError('');

        const sides = [];
        for (const field of sideFields) {
            const raw = field.input.value.trim().replace(',', '.');
            const value = Number(raw);
            if (!Number.isFinite(value) || value <= 0) {
                showError('Заполните все поля положительными числами.');
                sendBtn.disabled = true;
                return;
            }
            sides.push(value);
        }

        if (sides.length !== points.length) {
            showError('Количество длин сторон не совпадает с количеством вершин.');
            sendBtn.disabled = true;
            return;
        }

        try {
            builtPoints = buildPolygonFromSketchAndLengths(points, sides);
            builtSides = sides.slice();
            drawBuilt();
        } catch (e) {
            builtPoints = [];
            builtSides = [];
            sendBtn.disabled = true;
            showError(e?.message || 'Не удалось построить фигуру.');
            drawSketch();
        }
    }

    function buildSideInputs() {
        const n = points.length;
        if (sideFields.length === n) return;

        sideInputs.innerHTML = '';
        sideFields = [];

        for (let i = 0; i < n; i++) {
            const j = (i + 1) % n;
            const div = document.createElement('div');
            div.className = 'side-input';

            const label = document.createElement('label');
            label.textContent = `${getLabel(i)}–${getLabel(j)}`;

            const input = document.createElement('input');
            input.type = 'text';
            input.autocomplete = 'off';
            input.inputMode = 'decimal';
            input.placeholder = 'см';

            const unit = document.createElement('span');
            unit.className = 'unit';
            unit.textContent = 'см';

            div.append(label, input, unit);
            sideInputs.appendChild(div);
            sideFields.push({ input, label: `${getLabel(i)}–${getLabel(j)}` });

            input.addEventListener('input', () => {
                if (isClosed) rebuildFigure();
            });
        }
    }

    function addPoint(x, y) {
        if (isClosed) return;
        points.push({ x, y });
        builtPoints = [];
        builtSides = [];
        drawSketch();
    }

    function closeFigure() {
        if (isClosed || points.length < 3) return;

        for (let i = 0; i < points.length; i++) {
            const a = points[i];
            const b = points[(i + 1) % points.length];
            if (Math.hypot(a.x - b.x, a.y - b.y) < 2) {
                showError(`Слишком короткая сторона ${getLabel(i)}–${getLabel((i + 1) % points.length)}.`);
                return;
            }
        }

        isClosed = true;
        builtPoints = [];
        builtSides = [];
        showError('');
        drawSketch();
        setActiveTab('dimensions');
    }

    function undoLastPoint() {
        if (points.length === 0) return;
        points.pop();
        isClosed = false;
        builtPoints = [];
        builtSides = [];
        sideFields = [];
        sideInputs.innerHTML = '';
        showError('');
        tabs.classList.remove('visible');
        dimensionsPanel.classList.remove('visible');
        drawSketch();
    }

    function clearAll() {
        if (points.length === 0) return;
        if (!window.confirm('Удалить весь чертёж?')) return;
        points = [];
        isClosed = false;
        sideFields = [];
        builtPoints = [];
        builtSides = [];
        sideInputs.innerHTML = '';
        showError('');
        tabs.classList.remove('visible');
        dimensionsPanel.classList.remove('visible');
        drawSketch();
    }

    function getPointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
            y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
        };
    }

    canvas.addEventListener('pointerdown', event => {
        if (isClosed) return;
        event.preventDefault();
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        const p = getPointerPosition(event);
        addPoint(p.x, p.y);
    });

    function setActiveTab(tab) {
        activeTab = tab;
        const isDrawing = (tab === 'drawing');
        drawingTabBtn.classList.toggle('active', isDrawing);
        dimensionsTabBtn.classList.toggle('active', !isDrawing);
        if (isDrawing) {
            dimensionsPanel.classList.remove('visible');
        } else {
            if (isClosed) {
                dimensionsPanel.classList.add('visible');
                if (builtPoints.length >= 3) drawBuilt();
                else if (isClosed) drawSketch();
            }
        }
        resizeCanvas();
    }

    drawingTabBtn.addEventListener('click', () => setActiveTab('drawing'));
    dimensionsTabBtn.addEventListener('click', () => {
        if (isClosed) setActiveTab('dimensions');
    });

    closeBtn.addEventListener('click', closeFigure);
    undoBtn.addEventListener('click', undoLastPoint);
    clearBtn.addEventListener('click', clearAll);

    sendBtn.addEventListener('click', () => {
        if (builtPoints.length < 3 || builtSides.length !== builtPoints.length) {
            window.alert('Сначала введите корректные длины сторон и дождитесь построения фигуры.');
            return;
        }

        const data = {
            type: 'drawing',
            version: 2,
            units: 'm',
            points: builtPoints.map(p => ({
                x: Number(p.x.toFixed(6)),
                y: Number(p.y.toFixed(6))
            })),
            sides_cm: builtSides.map(s => Number(s.toFixed(3)))
        };

        try {
            if (tg) {
                tg.sendData(JSON.stringify(data));
                setTimeout(() => {
                    try { tg.close(); } catch (_) {}
                }, 350);
            } else {
                window.alert('Telegram WebApp не обнаружен.\nДанные:\n' + JSON.stringify(data, null, 2));
            }
        } catch (e) {
            window.alert('Ошибка отправки: ' + (e?.message || e));
        }
    });

    window.addEventListener('resize', resizeCanvas);
    if ('ResizeObserver' in window) {
        resizeObserver = new ResizeObserver(() => resizeCanvas());
        resizeObserver.observe(document.getElementById('canvasWrap'));
    }

    resizeCanvas();
    drawSketch();
})();
</script>
</body>
</html>
