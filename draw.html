<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рисуйте чертёж</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... стили как в предыдущей версии ... */
    </style>
</head>
<body>
    <!-- ... такой же HTML как раньше ... -->
    <script>
        (function() {

            const WebApp = window.Telegram?.WebApp || null;
            if (WebApp) {
                WebApp.ready();
                WebApp.expand();
            }

            // ... остальной код (рисование, поля ввода) без изменений ...

            // ==================== ОТПРАВКА ЧЕРЕЗ HTTP ====================
            sendBtn.addEventListener('click', function() {
                if (isSending) return;

                // ... проверки ...

                // Формируем данные
                const sendPoints = points.concat([{ x: points[0].x, y: points[0].y }]);
                const data = {
                    type: 'drawing',
                    points: sendPoints.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
                    sides_cm: sides
                };

                const json = JSON.stringify(data);
                // Получаем user_id из WebApp
                const user_id = WebApp?.initDataUnsafe?.user?.id || 0;

                // Отправляем на сервер бота
                fetch('https://ваш-сервер:5000/webapp_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, payload: json })
                })
                .then(res => res.json())
                .then(response => {
                    console.log('✅ Данные отправлены', response);
                    statusEl.textContent = '✅ Отправлено!';
                    setTimeout(() => WebApp.close(), 500);
                })
                .catch(err => {
                    console.error('❌ Ошибка:', err);
                    alert('Ошибка отправки. Попробуйте ещё раз.');
                    isSending = false;
                    sendBtn.disabled = false;
                    sendBtn.textContent = '✅ Отправить';
                    sendBtn.classList.remove('sending');
                });
            });

        })();
    </script>
</body>
</html>
